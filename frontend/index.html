<!doctype html>
<html lang="en">
<head>
  <title>Notes App</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Notes App</h1>
  <form id="noteForm">
    <input type="text" id="noteBody" placeholder="Type a note">
    <button type="submit">Save</button>
  </form>
  <div id="emptyMessage">
    <p>No notes found.</p>
  </div>
  <div id="notesGrid" class="grid"></div>
</body>
</html>
